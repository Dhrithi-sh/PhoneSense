[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonesense"
version = "0.1.0"
description = "PhoneSense: smartphone search with classic IR, neural IR and trust-aware graph ranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "numpy>=1.26", "nltk>=3.8"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8.0", "ruff>=0.6", "networkx>=3.2"]

[tool.setuptools.packages.find]
include = ["phonesense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# legacy/ holds the midterm project with its own conftest.py and tests: never collect it.
norecursedirs = ["legacy", "data", ".venv", "*.egg-info", ".git"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "runs", "results", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
